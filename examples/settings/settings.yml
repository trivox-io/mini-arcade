# Shared defaults for all tutorial examples.
scene:
  initial_scene: engine_config_basics

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

gameplay:
  scenes:
    backend_swap:
      escape:
        command: quit
    engine_config_basics:
      escape:
        command: quit
    debug_overlay_builtin:
      escape:
        command: quit
    minimal_scene:
      escape:
        command: quit
    base_entity_from_dict:
      escape:
        command: quit
    shape_primitives_gallery:
      escape:
        command: quit
    z_index_and_layer_intuition:
      escape:
        command: quit
    sprite_texture_basics:
      escape:
        command: quit
    animation_frames_basics:
      escape:
        command: quit
    fit_vs_fill:
      escape:
        command: quit
    resize_reflow:
      escape:
        command: quit
    screen_to_virtual_input:
      escape:
        command: quit
    virtual_resolution_basics:
      escape:
        command: quit

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: Mini Arcade Example
    resizable: true
  renderer:
    background_color: [20, 20, 20]
  audio:
    enable: false
