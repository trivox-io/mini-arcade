# Example-specific settings profile:
# Settings.for_example("window/fit_vs_fill")
scene:
  initial_scene: fit_vs_fill
  scene_registry:
    discover_packages:
      - examples.catalog.window.fit_vs_fill
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 1000
    height: 540
    title: window/fit_vs_fill
    resizable: true
  renderer:
    background_color: [8, 10, 16]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--window-width 1280 --window-height 720"

