# Example-specific settings profile:
# Settings.for_example("window/resize_reflow")
scene:
  initial_scene: resize_reflow
  scene_registry:
    discover_packages:
      - examples.catalog.window.resize_reflow
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: window/resize_reflow
    resizable: true
  renderer:
    background_color: [9, 12, 20]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--window-width 1280 --window-height 720"

