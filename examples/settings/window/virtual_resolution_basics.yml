# Example-specific settings profile:
# Settings.for_example("window/virtual_resolution_basics")
scene:
  initial_scene: virtual_resolution_basics
  scene_registry:
    discover_packages:
      - examples.catalog.window.virtual_resolution_basics
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: window/virtual_resolution_basics
    resizable: true
  renderer:
    background_color: [10, 12, 18]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--virtual-width 640 --virtual-height 360"
  - "--virtual-width 960 --virtual-height 540"

