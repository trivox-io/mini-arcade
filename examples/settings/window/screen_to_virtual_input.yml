# Example-specific settings profile:
# Settings.for_example("window/screen_to_virtual_input")
scene:
  initial_scene: screen_to_virtual_input
  scene_registry:
    discover_packages:
      - examples.catalog.window.screen_to_virtual_input
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 1000
    height: 540
    title: window/screen_to_virtual_input
    resizable: true
  renderer:
    background_color: [8, 10, 16]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--window-width 1280 --window-height 720"

