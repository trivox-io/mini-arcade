# Example-specific settings profile:
# Settings.for_example("systems/pause_intent_builtin")
scene:
  initial_scene: pause_intent_demo
  scene_registry:
    discover_packages:
      - examples.catalog.systems.pause_intent_builtin
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: systems/pause_intent_builtin
    resizable: true
  renderer:
    background_color: [16, 18, 28]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--virtual-width 960 --virtual-height 540"
