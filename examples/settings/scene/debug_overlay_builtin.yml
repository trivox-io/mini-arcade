# Example-specific settings profile:
# Settings.for_example("scene/debug_overlay_builtin")
scene:
  initial_scene: debug_overlay_builtin
  scene_registry:
    discover_packages:
      - examples.catalog.scene.debug_overlay_builtin
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

gameplay:
  debug_overlay:
    enabled: true
    title: Built-in Debug Overlay
    static_lines:
      - "Configured from settings.yml"
      - "Extra scene lines come from debug_overlay_lines()"
    sections: [timing, render, viewport, stack, scene]

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: scene/debug_overlay_builtin
    resizable: true
  renderer:
    background_color: [18, 20, 28]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--fps 75 --virtual-width 960 --virtual-height 540"
