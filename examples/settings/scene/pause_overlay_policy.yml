# Example-specific settings profile:
# Settings.for_example("scene/pause_overlay_policy")
scene:
  initial_scene: pause_overlay_policy_play
  scene_registry:
    discover_packages:
      - examples.catalog.scene.pause_overlay_policy
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

gameplay:
  scenes:
    pause_overlay_policy_pause:
      escape:
        command: remove_scene

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: scene/pause_overlay_policy
    resizable: true
  renderer:
    background_color: [10, 12, 18]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--fps 72 --virtual-width 960 --virtual-height 540"
