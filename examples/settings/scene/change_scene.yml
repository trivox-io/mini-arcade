# Example-specific settings profile:
# Settings.for_example("scene/change_scene")
scene:
  initial_scene: change_scene_hub
  scene_registry:
    discover_packages:
      - examples.catalog.scene.change_scene
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: scene/change_scene
    resizable: true
  renderer:
    background_color: [12, 14, 22]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
  - "--fps 72 --virtual-width 960 --virtual-height 540"

