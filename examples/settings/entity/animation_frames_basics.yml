# Example-specific settings profile:
# Settings.for_example("entity/animation_frames_basics")
scene:
  initial_scene: animation_frames_basics
  scene_registry:
    discover_packages:
      - examples.catalog.entity.animation_frames_basics
      - mini_arcade_core.scenes

engine_config:
  fps: 60
  virtual_resolution: [800, 600]
  enable_profiler: false
  postfx:
    enabled: false
    active: []

backend:
  provider: pygame
  window:
    width: 960
    height: 540
    title: entity/animation_frames_basics
    resizable: true
  renderer:
    background_color: [18, 18, 20]
  audio:
    enable: false

cli_examples:
  - "--backend pygame"
  - "--backend native"
